# Witness on the JAM Toaster public testnet (genesis 0xb8100ea7…, PolkaJam 0.1.29).
#
# There's no public RPC, so each run starts its own non-validating PolkaJam node, waits for it
# to sync, and then does `action`:
#   sync-only    measure syncing, and record the node's view of the chain
#   deploy       create the witness service from the build vendored in ascrivener/jam-lean
#                (pinned by its sha256, and compared with a rebuild at the same commit), configure it, and
#                propose handing the admin role to the key of the WITNESS_ADMIN_SEED secret
#   bounty       one bounty end to end on service `service_id`
#   apply        apply proposal `proposal_id` on service `service_id` once it's effective, and check
#                it took: a SetAdmin's key becomes the stored admin, an Upgrade's code hash the
#                service's code hash (and either must equal `expect`, if given)
# See docs/toaster.md. Logs and a summary are uploaded as the run's artifact.
name: Toaster

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do once the node has synced
        type: choice
        options: [sync-only, deploy, bounty, apply]
        default: sync-only
      service_id:
        description: Witness's service id (bounty, apply)
        default: ""
      proposal_id:
        description: The admin proposal to apply (apply)
        default: "0"
      expect:
        description: "apply: the admin key (SetAdmin) or code hash (Upgrade) the proposal must set, hex"
        default: ""
      cli_commit:
        description: The commit to build the witness CLI and checks at, to match the running code (default the deployed 71e585a)
        default: ""
      sync_timeout_minutes:
        description: How long to wait for the node to sync
        default: "300"
      stall_minutes:
        description: Give up if the node has no blocks past genesis after this long
        default: "20"
      node_args:
        description: Extra arguments for `polkajam run` (e.g. --listen-ip 0.0.0.0)
        default: ""

concurrency:
  group: toaster
  cancel-in-progress: false

permissions:
  contents: read

env:
  POLKAJAM_VERSION: 0.1.29
  CHAINSPEC_URL: https://jamtoaster.network/chainspec/public.json
  # The Toaster is identified by its genesis header's hash: the chain spec's id has changed
  # (public-30, then public) while the chain stayed the same.
  GENESIS_HASH: b8100ea7c6c6f952bf2ad61192e17f5b788f510ae7d86603edbe9f792412087d
  # The witness build jam-lean's theorems are about: ascrivener/witness at 71e585a, built with
  # cargo jam-build 0.1.29, vendored in ascrivener/jam-lean at this commit.
  WITNESS_COMMIT: 71e585a634545b1cb90cf4737198a74865ee2100
  JAM_LEAN_COMMIT: 98bc6aa6a44f81967024446bb9c53e8f1406b642
  SERVICE_SHA256: 408b5be2fde1ae49b64f7c1ee44d2660472f1c9545320bf7a65ee9281206e2e4
  RUST_TOOLCHAIN: 1.97.0
  JAM_RPC: ws://localhost:19800
  LOGS: ${{ github.workspace }}/toaster-logs

jobs:
  toaster:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check inputs
        env:
          ACTION: ${{ inputs.action }}
          SERVICE_ID: ${{ inputs.service_id }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          EXPECT: ${{ inputs.expect }}
          CLI_COMMIT: ${{ inputs.cli_commit }}
          TIMEOUT: ${{ inputs.sync_timeout_minutes }}
          STALL: ${{ inputs.stall_minutes }}
        run: |
          mkdir -p "$LOGS"
          [[ $TIMEOUT =~ ^[0-9]+$ ]] || { echo "bad sync_timeout_minutes"; exit 1; }
          [[ $STALL =~ ^[0-9]+$ ]] || { echo "bad stall_minutes"; exit 1; }
          case $ACTION in
            bounty|apply) [[ $SERVICE_ID =~ ^[0-9]+$ ]] || { echo "$ACTION needs service_id"; exit 1; } ;;
          esac
          [[ $PROPOSAL_ID =~ ^[0-9]+$ ]] || { echo "bad proposal_id"; exit 1; }
          [[ -z $EXPECT || $EXPECT =~ ^(0x)?[0-9a-fA-F]{64}$ ]] || { echo "bad expect: 32 bytes of hex"; exit 1; }
          [[ -z $CLI_COMMIT || $CLI_COMMIT =~ ^[0-9a-f]{7,40}$ ]] || { echo "bad cli_commit"; exit 1; }

      - name: Host setup
        run: |
          sudo sysctl vm.unprivileged_userfaultfd=1
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          { uname -a; nproc; free -h; df -h .; ip addr; } >"$LOGS/host.txt" 2>&1

      - name: Download PolkaJam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/polkajam" && cd "$RUNNER_TEMP/polkajam"
          for tag in "v$POLKAJAM_VERSION" v0.8.0; do
            names=$(gh release view "$tag" -R paritytech/polkajam-releases --json assets -q '.assets[].name' || true)
            [ -n "$names" ] && break
          done
          echo "release $tag assets:"; echo "$names"
          asset=$(grep -i linux <<<"$names" | grep -iE 'x86_64|amd64|x64' | grep -viE 'sha|sig|asc' | head -1)
          [ -n "$asset" ] || { echo "no linux x86_64 asset"; exit 1; }
          gh release download "$tag" -R paritytech/polkajam-releases -p "$asset"
          case $asset in
            *.tar.gz|*.tgz) tar xzf "$asset" ;;
            *.tar.xz) tar xJf "$asset" ;;
            *.zip) unzip -q "$asset" ;;
            *) chmod +x "$asset" ;;
          esac
          for bin in polkajam jamt; do
            path=$(find "$PWD" -type f -name "$bin" | head -1)
            [ -n "$path" ] || { echo "no $bin in $asset"; find . -type f; exit 1; }
            chmod +x "$path"
            echo "$(echo "$bin" | tr a-z A-Z)=$path" >>"$GITHUB_ENV"
          done
          echo "$tag $asset $(sha256sum "$asset" | cut -d' ' -f1)" >"$LOGS/polkajam-release.txt"

      - name: Fetch the chain spec
        run: |
          curl -fsSL "$CHAINSPEC_URL" -o "$RUNNER_TEMP/public.json"
          id=$(jq -r '.id // empty' "$RUNNER_TEMP/public.json")
          genesis=$(jq -r '.genesis_header' "$RUNNER_TEMP/public.json" | python3 -c \
            "import hashlib, sys; print(hashlib.blake2b(bytes.fromhex(sys.stdin.read().strip()), digest_size=32).hexdigest())")
          {
            echo "chain spec id: $id, sha256: $(sha256sum "$RUNNER_TEMP/public.json" | cut -d' ' -f1)"
            echo "genesis header hash: 0x$genesis"
            echo "bootnodes: $(jq -c '.bootnodes' "$RUNNER_TEMP/public.json")"
          } | tee "$LOGS/chainspec.txt"
          [ "$genesis" = "$GENESIS_HASH" ] || { echo "expected genesis 0x$GENESIS_HASH"; exit 1; }
          jq 'del(.genesis_state)' "$RUNNER_TEMP/public.json" >"$LOGS/chainspec-head.json" || true

      - name: Start the node
        env:
          NODE_ARGS: ${{ inputs.node_args }}
        run: |
          { "$POLKAJAM" --version; "$POLKAJAM" --help; "$POLKAJAM" run --help; "$JAMT" --help; } >"$LOGS/help.txt" 2>&1 || true
          version=$("$POLKAJAM" --version); echo "$version"
          grep -q "$POLKAJAM_VERSION" <<<"$version" || { echo "expected polkajam $POLKAJAM_VERSION"; exit 1; }
          # Not `--chain toaster`: in PolkaJam 0.1.29 that is another network (stress-255).
          args=(--chain "$RUNNER_TEMP/public.json" run --rpc-port 19800 --temp)
          # Runners have no global IPv6; bind IPv4 if the node offers the flag and none was given.
          if [ -z "$(ip -6 addr show scope global)" ] && grep -q -- '--listen-ip' "$LOGS/help.txt" \
              && ! grep -q -- '--listen-ip' <<<"$NODE_ARGS"; then
            args+=(--listen-ip 0.0.0.0)
          fi
          # An ordinary node submits work packages through a proxy; without one, create-service fails
          # with "Failed to submit work-package to even a single proxy/guarantor". The chain spec's
          # first bootnode serves as one.
          if ! grep -qE -- '--(no-)?proxy' <<<"$NODE_ARGS"; then
            proxy=$(jq -r '.bootnodes[0] // empty' "$RUNNER_TEMP/public.json")
            [ -n "$proxy" ] || { echo "the chain spec lists no bootnode to use as a proxy"; exit 1; }
            args+=(--proxy "$proxy")
          fi
          # shellcheck disable=SC2206
          args+=($NODE_ARGS)
          echo "polkajam ${args[*]}" | tee "$LOGS/node-command.txt"
          nohup "$POLKAJAM" "${args[@]}" >"$LOGS/node.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/node.pid"
          sleep 20
          kill -0 "$(cat "$RUNNER_TEMP/node.pid")" || { tail -50 "$LOGS/node.log"; exit 1; }
          tail -20 "$LOGS/node.log"
          # A fresh node's best final block is genesis; the log shows its hash's first 8 bytes.
          grep -m1 'Chain ID:' "$LOGS/node.log" || true
          grep -q "Best final block: 0x${GENESIS_HASH:0:16}" "$LOGS/node.log" \
            || { echo "the node's genesis isn't 0x$GENESIS_HASH"; exit 1; }

      # While the node syncs: build the CLI and the checks at the deployed commit, and get the
      # service blob from jam-lean, checked against the rebuild.
      # jam-lean's blob was built with rustc 1.97.0; a newer rustc gives other bytes.
      - name: Install Rust and cargo-jam-build
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rust-src
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >>"$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-jam-build
          key: cargo-jam-build-0.1.29-${{ runner.os }}
      - run: command -v cargo-jam-build || cargo install cargo-jam-build --version 0.1.29 --locked
      - name: Build witness at the deployed commit
        env:
          CLI_COMMIT: ${{ inputs.cli_commit }}
        run: |
          git worktree add "$RUNNER_TEMP/w" "$WITNESS_COMMIT"
          cd "$RUNNER_TEMP/w"
          { rustc --version; cargo --version; cargo jam-build --version; } | tee "$LOGS/toolchain.txt"
          cargo build --locked -p witness-cli
          cargo jam-build --out-dir out -- --locked
          sha256sum out/*.jam | tee "$LOGS/built-blobs.txt"
          cli=$RUNNER_TEMP/w
          # The CLI (its ops, keys and decoding) must match the code the service runs, which an
          # upgrade changes. It's the same at 71e585a and at the upgrade's commit.
          if [ -n "$CLI_COMMIT" ] && [ "$(git rev-parse "$CLI_COMMIT^{commit}")" != "$(git rev-parse HEAD)" ]; then
            git worktree add "$RUNNER_TEMP/cli" "$CLI_COMMIT"
            cli=$RUNNER_TEMP/cli
            (cd "$cli" && cargo build --locked -p witness-cli && cargo jam-build --out-dir out -- --locked)
          fi
          echo "CLI and checks from $(git -C "$cli" rev-parse HEAD)" | tee -a "$LOGS/toolchain.txt"
          echo "W=$cli/target/debug/witness" >>"$GITHUB_ENV"
          echo "CHECKS=$cli/out" >>"$GITHUB_ENV"
      - name: Get the vendored service blob
        run: |
          blob=$RUNNER_TEMP/witness-service.jam
          curl -fsSL "https://raw.githubusercontent.com/ascrivener/jam-lean/$JAM_LEAN_COMMIT/services/witness/witness-service.jam" -o "$blob"
          # The gate is the pinned hash. The rebuild is a cross-check: it depends on the toolchain.
          echo "$SERVICE_SHA256  $blob" | sha256sum -c
          if cmp "$blob" "$RUNNER_TEMP/w/out/witness-service.jam"; then
            echo "jam-lean's blob (sha256 $SERVICE_SHA256) is the rebuild, byte for byte" | tee "$LOGS/blob-check.txt"
          else
            echo "::warning::the rebuild differs from jam-lean's blob; deploying jam-lean's (sha256 $SERVICE_SHA256)"
            echo "rebuild differs: $(sha256sum "$RUNNER_TEMP/w/out/witness-service.jam")" | tee "$LOGS/blob-check.txt"
          fi
          echo "SERVICE_JAM=$blob" >>"$GITHUB_ENV"

      - name: Wait for the node to sync
        id: sync
        env:
          TIMEOUT: ${{ inputs.sync_timeout_minutes }}
          SYNC_STALL_MINUTES: ${{ inputs.stall_minutes }}
        run: |
          set +e
          python3 scripts/toaster/sync.py "$TIMEOUT" "$LOGS/sync.csv" "$LOGS/sync-status.json"
          status=$?
          kill -0 "$(cat "$RUNNER_TEMP/node.pid")" || { echo "the node died"; tail -50 "$LOGS/node.log"; exit 1; }
          echo "synced=$([ $status = 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          exit 0

      - name: The node's view of the chain
        if: always()
        run: |
          echo "## node log: $(grep -c 'Failed to connect' "$LOGS/node.log" || true) failed bootnode connections"
          grep -E 'Net status|Sync status' "$LOGS/node.log" | awk 'NR % 150 == 1' | tail -40 || true
          grep -vE 'Net status|Sync status|Failed to connect|jsonrpsee' "$LOGS/node.log" | tail -40 || true
          {
            echo "## jamt inspect slot"; timeout 60 "$JAMT" inspect slot
            echo "## jamt list"; timeout 60 "$JAMT" list
            echo "## parameters"; timeout 60 python3 -c "import sys; sys.path.insert(0, 'scripts'); from jamrpc import Rpc, url; import json; print(json.dumps(Rpc(url()).call('parameters'), indent=1))"
          } >"$LOGS/chain-view.txt" 2>&1 || true
          cat "$LOGS/chain-view.txt"

      - name: Not synced
        if: steps.sync.outputs.synced != 'true'
        env:
          ACTION: ${{ inputs.action }}
        run: |
          echo "The node didn't sync in time."
          [ "$ACTION" = sync-only ] || exit 1

      - name: Deploy
        if: inputs.action == 'deploy' && steps.sync.outputs.synced == 'true'
        env:
          WITNESS_ADMIN_SEED: ${{ secrets.WITNESS_ADMIN_SEED }}
          OUT: ${{ env.LOGS }}
        run: scripts/toaster/run.sh deploy

      - name: Bounty
        if: inputs.action == 'bounty' && steps.sync.outputs.synced == 'true'
        env:
          OUT: ${{ env.LOGS }}
          SERVICE_ID: ${{ inputs.service_id }}
        run: scripts/toaster/run.sh bounty "$SERVICE_ID"

      # Unsigned: anyone can apply an effective proposal, so no key is needed.
      - name: Apply a proposal
        if: inputs.action == 'apply' && steps.sync.outputs.synced == 'true'
        env:
          OUT: ${{ env.LOGS }}
          SERVICE_ID: ${{ inputs.service_id }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          EXPECT: ${{ inputs.expect }}
        run: scripts/toaster/run.sh apply "$SERVICE_ID" "$PROPOSAL_ID" "$EXPECT"

      - name: Summary
        if: always()
        env:
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "### Toaster: $ACTION"
            for f in sync-status.json summary.json; do
              [ -f "$LOGS/$f" ] && { echo "\`$f\`"; echo '```json'; cat "$LOGS/$f"; echo '```'; }
            done
          } >>"$GITHUB_STEP_SUMMARY"
          kill "$(cat "$RUNNER_TEMP/node.pid" 2>/dev/null)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toaster-${{ inputs.action }}-${{ github.run_id }}
          path: toaster-logs/
