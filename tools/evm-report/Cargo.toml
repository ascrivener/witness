[package]
name = "evm-report"
description = "Builds test cases for the evm-bounty check: synthetic state with mainnet-depth proofs, toy contracts, and the check arguments for each phase"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
evm-bounty-check = { path = "../../checks/evm-bounty" }
witness-types = { workspace = true, features = ["std"] }
revm = { version = "43.0.3", default-features = false, features = ["std", "optional_no_base_fee"] }
alloy-trie = { version = "0.9.8" }
alloy-rlp = { version = "0.3" }
