[package]
name = "witness-check"
description = "Helpers for writing witness check blobs: `fn check(params: &[u8], x: &[u8]) -> bool` as a PVM program"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
polkavm-derive.workspace = true

[target.'cfg(target_env = "polkavm")'.dependencies]
picoalloc = { version = "5.2.0", optional = true }

[features]
# A global allocator, so checks can use `alloc` (`Vec`, `BTreeMap`, ...).
alloc = ["dep:picoalloc"]

[dev-dependencies]
witness-types = { workspace = true, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("polkavm"))'] }
