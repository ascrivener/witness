[package]
name = "evm-bounty-check"
description = "Witness check for settled bug bounties: replays a report's transactions in revm against Merkle-proven historical state, and accepts when the bounty's invariant fails"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# A check has one entry point at pc 0, which is the authorizer layout.
[package.metadata.jam]
type = "authorizer"

[dependencies]
witness-check = { workspace = true, features = ["alloc"] }
polkavm-derive.workspace = true
revm = { version = "43.0.3", default-features = false, features = ["optional_no_base_fee"] }
alloy-trie = { version = "0.9.8", default-features = false }
alloy-rlp = { version = "0.3", default-features = false, features = ["derive"] }

[dev-dependencies]
witness-types = { workspace = true, features = ["std"] }
